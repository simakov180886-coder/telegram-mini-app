<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мини-казино</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #111827, #020617);
      color: white;
      display: flex; justify-content: center; align-items: center;
    }
    .casino { width: 100%; max-width: 430px; padding: 20px 16px 30px; text-align: center; }
    .greeting { color: #9ca3af; font-size: 14px; margin-bottom: 6px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { color: #9ca3af; margin-bottom: 16px; font-size: 14px; }

    .level-bar {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; text-align: left;
    }
    .level-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
    .level-name { font-weight: bold; color: #f59e0b; }
    .level-count { color: #9ca3af; }
    .level-track { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .level-fill { height: 100%; background: #f59e0b; width: 0%; transition: width .4s; }
    .level-bonus { font-size: 11px; color: #9ca3af; margin-top: 5px; }

    .balance {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px; padding: 12px; margin-bottom: 12px;
    }
    .balance-title { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
    .coins { font-size: 26px; font-weight: bold; }

    .bonus {
      width: 100%; padding: 11px; margin-bottom: 14px;
      border-radius: 14px; border: 1px dashed #f59e0b;
      background: rgba(245,158,11,0.1); color: #f59e0b;
      font-weight: bold; font-size: 14px; cursor: pointer;
    }
    .bonus:disabled { opacity: .45; cursor: default; border-style: solid; color: #9ca3af; border-color: rgba(255,255,255,0.15); background: transparent; }

    .machine {
      background: rgba(255,255,255,0.08); border-radius: 24px;
      padding: 20px 14px; border: 1px solid rgba(255,255,255,0.12);
    }
    .slots { display: flex; gap: 10px; justify-content: center; margin: 8px 0 14px; }
    .slot {
      width: 80px; height: 80px; background: #fff;
      border-radius: 16px; overflow: hidden;
      position: relative;
      box-shadow: 0 8px 25px rgba(0,0,0,.3);
      transition: box-shadow .3s;
    }
    .reel {
      position: absolute; top: 0; left: 0; width: 100%;
      will-change: transform;
    }
    .sym {
      height: 80px; display: flex; align-items: center; justify-content: center;
      font-size: 42px; color: #111827; user-select: none;
    }
    .slot.win {
      box-shadow: 0 0 0 3px #f59e0b, 0 0 25px #f59e0b;
      animation: pop .5s;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .bets-title { font-size: 11px; color: #9ca3af; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .bets { display: flex; gap: 5px; justify-content: center; margin-bottom: 12px; }
    .bet {
      flex: 1; padding: 9px 2px; border-radius: 11px;
      background: rgba(255,255,255,0.06); color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .bet.active { background: #f59e0b; color: #111827; border-color: #f59e0b; }
    .bet.max { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.5); color: #fca5a5; }

    button.spin {
      width: 100%; border: 0; border-radius: 16px; padding: 15px;
      font-size: 18px; font-weight: bold; cursor: pointer;
      background: #f59e0b; color: #111827;
    }
    button:disabled { opacity: .5; }

    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions button {
      flex: 1; padding: 11px; border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06); color: white;
      font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .actions button.auto-running { background: #ef4444; border-color: #ef4444; }

    .reset {
      margin-top: 10px; padding: 9px; font-size: 12px; font-weight: normal;
      width: 100%; border-radius: 13px; cursor: pointer;
      background: transparent; color: #9ca3af;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .message { min-height: 26px; margin-top: 14px; font-weight: bold; font-size: 15px; }

    .panel {
      margin-top: 16px; padding: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
    }
    .panel-title { font-size: 11px; color: #9ca3af; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

    .achievements { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .ach {
      aspect-ratio: 1; border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; opacity: .35;
    }
    .ach.unlocked {
      opacity: 1; background: rgba(245,158,11,0.15);
      border-color: rgba(245,158,11,0.5);
      box-shadow: 0 0 12px rgba(245,158,11,0.4);
    }

    .task {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px; text-align: left;
    }
    .task:last-child { border-bottom: 0; }
    .task-info { flex: 1; }
    .task-title { font-weight: bold; }
    .task-progress { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .task-claim {
      padding: 6px 10px; border-radius: 8px; border: 0;
      background: #f59e0b; color: #111827;
      font-weight: bold; font-size: 11px; cursor: pointer;
    }
    .task-claim:disabled { background: rgba(255,255,255,0.1); color: #9ca3af; cursor: default; }
    .task-claim.done { background: transparent; color: #4ade80; border: 1px solid #4ade80; }

    .stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
    .stat-label { color: #9ca3af; }
    .stat-value { font-weight: bold; }
    .stat-value.pos { color: #4ade80; }
    .stat-value.neg { color: #f87171; }

    .history-list { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 28px; }
    .history-item {
      background: rgba(255,255,255,0.1); border-radius: 8px;
      padding: 4px 7px; font-size: 18px; letter-spacing: 1px;
    }
    .history-item.jackpot { background: rgba(245,158,11,0.3); }

    .info { color: #9ca3af; font-size: 12px; margin-top: 14px; }

    .win-banner {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 52px; font-weight: 900; color: #f59e0b;
      text-shadow: 0 0 30px rgba(245,158,11,0.9), 0 4px 20px rgba(0,0,0,0.9);
      pointer-events: none; z-index: 999; opacity: 0; white-space: nowrap;
    }
    .win-banner.show { animation: bannerPop 2s ease-out forwards; }
    .win-banner.small { font-size: 38px; color: #4ade80; text-shadow: 0 0 25px rgba(74,222,128,0.8), 0 4px 20px rgba(0,0,0,0.9); }
    @keyframes bannerPop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      40% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
    }

    .toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(120px);
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #111827; padding: 12px 20px; border-radius: 14px;
      font-weight: bold; font-size: 14px; z-index: 1000;
      box-shadow: 0 10px 30px rgba(245,158,11,0.5);
      transition: transform .4s;
      max-width: 90vw; text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="win-banner" id="winBanner"></div>
  <div class="toast" id="toast"></div>

  <div class="casino">
    <div class="greeting" id="greeting">Привет!</div>
    <h1>🎰 Мини-казино</h1>

    <div class="level-bar">
      <div class="level-top">
        <span class="level-name" id="levelName">Новичок</span>
        <span class="level-count" id="levelCount">0 / 50</span>
      </div>
      <div class="level-track"><div class="level-fill" id="levelFill"></div></div>
      <div class="level-bonus" id="levelBonus">Бонус к выигрышу: +0%</div>
    </div>

    <div class="balance">
      <div class="balance-title">Ваш баланс</div>
      <div class="coins">🪙 <span id="balance">1000</span></div>
    </div>

    <button class="bonus" id="bonus">🎁 Забрать бонус +500</button>

    <div class="machine">
      <div class="slots">
        <div class="slot" id="slot1"><div class="reel" id="reel1"></div></div>
        <div class="slot" id="slot2"><div class="reel" id="reel2"></div></div>
        <div class="slot" id="slot3"><div class="reel" id="reel3"></div></div>
      </div>

      <div class="bets-title">Ставка</div>
      <div class="bets">
        <button class="bet" data-bet="50">50</button>
        <button class="bet" data-bet="100">100</button>
        <button class="bet" data-bet="250">250</button>
        <button class="bet" data-bet="500">500</button>
        <button class="bet max" id="maxBtn">МАКС</button>
      </div>

      <button class="spin" id="spin">КРУТИТЬ — 50 🪙</button>

      <div class="actions">
        <button id="autoBtn">⚡ АВТО ×5</button>
        <button id="shareBtn">📤 Поделиться</button>
      </div>

      <button class="reset" id="reset">Сбросить баланс</button>
      <div class="message" id="message"></div>
      <div class="info">Только виртуальные монеты. Реальных денег нет.</div>
    </div>

    <div class="panel">
      <div class="panel-title">🎖 Достижения</div>
      <div class="achievements" id="achGrid"></div>
    </div>

    <div class="panel">
      <div class="panel-title">📅 Задания на сегодня</div>
      <div id="tasksList"></div>
    </div>

    <div class="panel">
      <div class="panel-title">📊 Статистика</div>
      <div class="stat-row"><span class="stat-label">Спинов</span><span class="stat-value" id="statSpins">0</span></div>
      <div class="stat-row"><span class="stat-label">Всего выиграно</span><span class="stat-value" id="statWon">0 🪙</span></div>
      <div class="stat-row"><span class="stat-label">Лучший выигрыш</span><span class="stat-value" id="statBest">0 🪙</span></div>
      <div class="stat-row"><span class="stat-label">Джекпотов</span><span class="stat-value" id="statJackpots">0</span></div>
      <div class="stat-row"><span class="stat-label">Итог</span><span class="stat-value" id="statNet">0 🪙</span></div>
      <button class="reset" id="resetStats">Сбросить статистику</button>
    </div>

    <div class="panel">
      <div class="panel-title">Последние спины</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
    // ========== Telegram ==========
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        const name = user.first_name || user.username || 'игрок';
        document.getElementById('greeting').textContent = 'Привет, ' + name + '!';
      }
    } else {
      document.getElementById('greeting').textContent = 'Привет, гость! (вне Telegram)';
    }

    // ========== Звук ==========
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      return audioCtx;
    }
    function unlockAudio() {
      const ctx = getAudio();
      if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    }
    ['touchstart','click','touchend'].forEach(ev =>
      document.addEventListener(ev, unlockAudio, { passive: true }));

    function playTone(freq, dur, type = 'sine', vol = 0.15) {
      const ctx = getAudio();
      if (!ctx || ctx.state !== 'running') return;
      try {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    // Глухой механический стук (для кручения)
    function soundReelTick() {
      playTone(120, 0.02, 'square', 0.06);
      playTone(80, 0.03, 'sine', 0.05);
    }

    // Дзынь остановки барабана
    function soundReelStop() {
      playTone(700, 0.05, 'sine', 0.18);
      playTone(1400, 0.08, 'sine', 0.10);
      setTimeout(() => playTone(200, 0.06, 'square', 0.06), 20);
    }

    // Звон одной монеты
    function coinDing(delay, freq, vol) {
      setTimeout(() => {
        playTone(freq, 0.10, 'sine', vol);
        playTone(freq * 2, 0.06, 'sine', vol * 0.5);
      }, delay);
    }

    // Небольшой выигрыш — быстрые "дзынь-дзынь"
    function soundWin() {
      for (let i = 0; i < 7; i++) {
        const freq = 1800 + Math.random() * 1500;
        coinDing(i * 65 + Math.random() * 25, freq, 0.18);
      }
    }

    // Джекпот — фанфары + каскад монет "дзынь-дзынь-дзынь..."
    function soundJackpot() {
      // Фанфары
      const fanfare = [523, 659, 784, 1047, 1319];
      fanfare.forEach((f, i) => setTimeout(() => playTone(f, 0.18, 'sine', 0.20), i * 100));
      // Каскад монет — 40 штук за ~2.8 секунды
      for (let i = 0; i < 40; i++) {
        const freq = 1500 + Math.random() * 2400;
        coinDing(500 + i * 65 + Math.random() * 40, freq, 0.15 + Math.random() * 0.08);
      }
    }

    // Проигрыш
    function soundLose() {
      playTone(320, 0.18, 'sawtooth', 0.07);
      setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.07), 140);
    }

    // ========== Хранилище ==========
    const START_BALANCE = 1000;
    function loadNum(key, def) {
      const v = parseInt(localStorage.getItem(key), 10);
      return isNaN(v) ? def : v;
    }
    let balance = loadNum('casino_balance', START_BALANCE);
    let bet = loadNum('casino_bet', 50);
    if (![50, 100, 250, 500].includes(bet)) bet = 50;

    let stats = JSON.parse(localStorage.getItem('casino_stats') || 'null') || {
      spins: 0, totalBet: 0, totalWon: 0, bestWin: 0, jackpots: 0, diamonds: 0, lucky7: 0
    };
    if (stats.jackpots === undefined) stats.jackpots = 0;
    if (stats.diamonds === undefined) stats.diamonds = 0;
    if (stats.lucky7 === undefined) stats.lucky7 = 0;

    let history = JSON.parse(localStorage.getItem('casino_history') || '[]');
    let unlocked = JSON.parse(localStorage.getItem('casino_ach') || '[]');

    function saveBalance() { localStorage.setItem('casino_balance', String(balance)); }
    function saveStats() { localStorage.setItem('casino_stats', JSON.stringify(stats)); }
    function saveAch() { localStorage.setItem('casino_ach', JSON.stringify(unlocked)); }

    // ========== Уровни ==========
    const LEVELS = [
      { name: 'Новичок',    spins: 0,    bonus: 0 },
      { name: 'Любитель',   spins: 50,   bonus: 2 },
      { name: 'Профи',      spins: 200,  bonus: 5 },
      { name: 'Хайроллер',  spins: 500,  bonus: 10 },
      { name: 'Легенда',    spins: 1000, bonus: 15 }
    ];
    function getLevel() {
      let cur = LEVELS[0], next = null;
      for (let i = 0; i < LEVELS.length; i++) {
        if (stats.spins >= LEVELS[i].spins) { cur = LEVELS[i]; next = LEVELS[i + 1] || null; }
      }
      return { cur, next };
    }
    function renderLevel() {
      const { cur, next } = getLevel();
      document.getElementById('levelName').textContent = cur.name;
      document.getElementById('levelBonus').textContent = 'Бонус к выигрышу: +' + cur.bonus + '%';
      if (next) {
        document.getElementById('levelCount').textContent = stats.spins + ' / ' + next.spins;
        const pct = Math.min(100, ((stats.spins - cur.spins) / (next.spins - cur.spins)) * 100);
        document.getElementById('levelFill').style.width = pct + '%';
      } else {
        document.getElementById('levelCount').textContent = stats.spins + ' (макс)';
        document.getElementById('levelFill').style.width = '100%';
      }
    }

    // ========== Достижения ==========
    const ACHIEVEMENTS = [
      { id: 'first_spin',   icon: '🎯', title: 'Первый спин',    cond: () => stats.spins >= 1 },
      { id: 'spins_10',     icon: '🔟', title: '10 спинов',      cond: () => stats.spins >= 10 },
      { id: 'spins_100',    icon: '💯', title: '100 спинов',     cond: () => stats.spins >= 100 },
      { id: 'spins_500',    icon: '🚀', title: '500 спинов',     cond: () => stats.spins >= 500 },
      { id: 'jackpot_1',    icon: '🎰', title: 'Первый джекпот', cond: () => stats.jackpots >= 1 },
      { id: 'jackpot_10',   icon: '🏅', title: '10 джекпотов',   cond: () => stats.jackpots >= 10 },
      { id: 'diamond',      icon: '💎', title: 'Три алмаза',     cond: () => stats.diamonds >= 1 },
      { id: 'lucky7',       icon: '7️⃣', title: 'Лаки 7',         cond: () => stats.lucky7 >= 1 },
      { id: 'rich',         icon: '💰', title: 'Богач (10к)',    cond: () => balance >= 10000 },
      { id: 'millionaire',  icon: '🏆', title: 'Миллионер',      cond: () => balance >= 100000 },
      { id: 'big_win',      icon: '🔥', title: 'Куш 10 000',     cond: () => stats.bestWin >= 10000 },
      { id: 'big_win_50',   icon: '💥', title: 'Куш 50 000',     cond: () => stats.bestWin >= 50000 },
      { id: 'spin_auto',    icon: '⚡', title: 'Автоспинер',     cond: () => false },
      { id: 'bonus_taken',  icon: '🎁', title: 'Первый бонус',   cond: () => loadNum('casino_last_bonus', 0) > 0 },
      { id: 'all_ach',      icon: '👑', title: 'Король казино',  cond: () => false }
    ];
    function renderAchievements() {
      const grid = document.getElementById('achGrid');
      grid.innerHTML = '';
      ACHIEVEMENTS.forEach(a => {
        const div = document.createElement('div');
        div.className = 'ach' + (unlocked.includes(a.id) ? ' unlocked' : '');
        div.textContent = a.icon;
        div.title = a.title;
        grid.appendChild(div);
      });
    }
    function checkAchievements() {
      ACHIEVEMENTS.forEach(a => {
        if (!unlocked.includes(a.id) && a.cond()) {
          unlocked.push(a.id);
          saveAch();
          showToast('🎖 Достижение: ' + a.title);
          renderAchievements();
        }
      });
    }

    // ========== Ежедневные задания ==========
    function todayKey() { return new Date().toISOString().slice(0, 10); }
    const DAILY_TASKS = [
      { id: 'spins20', title: '20 спинов сегодня',    reward: 300,  target: 20 },
      { id: 'jackpot', title: 'Сорви джекпот',        reward: 1000, target: 1 },
      { id: 'bet1000', title: 'Потрать 1000 монет',   reward: 200,  target: 1000 }
    ];
    let daily = JSON.parse(localStorage.getItem('casino_daily') || 'null');
    if (!daily || daily.date !== todayKey()) {
      daily = { date: todayKey(), progress: {}, claimed: [] };
      saveDaily();
    }
    function saveDaily() { localStorage.setItem('casino_daily', JSON.stringify(daily)); }
    function renderDaily() {
      const box = document.getElementById('tasksList');
      box.innerHTML = '';
      DAILY_TASKS.forEach(t => {
        const prog = daily.progress[t.id] || 0;
        const done = prog >= t.target;
        const isClaimed = daily.claimed.includes(t.id);
        const div = document.createElement('div');
        div.className = 'task';
        div.innerHTML =
          '<div class="task-info">' +
            '<div class="task-title">' + t.title + '</div>' +
            '<div class="task-progress">' + Math.min(prog, t.target) + ' / ' + t.target + ' • +' + t.reward + ' 🪙</div>' +
          '</div>' +
          '<button class="task-claim' + (isClaimed ? ' done' : '') + '" ' + (!done || isClaimed ? 'disabled' : '') + '>' +
            (isClaimed ? '✓ Получено' : 'Забрать') +
          '</button>';
        div.querySelector('button').addEventListener('click', () => {
          if (!done || isClaimed) return;
          daily.claimed.push(t.id);
          saveDaily();
          balance += t.reward;
          saveBalance(); updateBalanceUI();
          messageEl.textContent = '🎁 Награда получена! +' + t.reward + ' 🪙';
          soundWin();
          showToast('+' + t.reward + ' 🪙 за задание');
          renderDaily();
          checkAchievements();
        });
        box.appendChild(div);
      });
    }
    function progressDaily(id, amount) {
      daily.progress[id] = (daily.progress[id] || 0) + amount;
      saveDaily();
      renderDaily();
    }

    // ========== Элементы ==========
    const balanceEl = document.getElementById('balance');
    const spinButton = document.getElementById('spin');
    const resetButton = document.getElementById('reset');
    const resetStatsBtn = document.getElementById('resetStats');
    const shareBtn = document.getElementById('shareBtn');
    const autoBtn = document.getElementById('autoBtn');
    const maxBtn = document.getElementById('maxBtn');
    const messageEl = document.getElementById('message');
    const bonusBtn = document.getElementById('bonus');
    const betButtons = document.querySelectorAll('.bet[data-bet]');
    const slotEls = [
      document.getElementById('slot1'),
      document.getElementById('slot2'),
      document.getElementById('slot3')
    ];
    const reelEls = [
      document.getElementById('reel1'),
      document.getElementById('reel2'),
      document.getElementById('reel3')
    ];

    let isSpinning = false, autoRunning = false;

    function updateBalanceUI() { balanceEl.textContent = balance; }

    // ========== Ставка ==========
    function updateBetUI() {
      betButtons.forEach(b => b.classList.toggle('active', parseInt(b.dataset.bet, 10) === bet));
      spinButton.textContent = 'КРУТИТЬ — ' + bet + ' 🪙';
    }
    betButtons.forEach(b => b.addEventListener('click', () => {
      bet = parseInt(b.dataset.bet, 10);
      localStorage.setItem('casino_bet', String(bet));
      updateBetUI();
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }));
    maxBtn.addEventListener('click', () => {
      bet = [500, 250, 100, 50].find(p => p <= balance) || 50;
      localStorage.setItem('casino_bet', String(bet));
      updateBetUI();
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    });

    // ========== Управление ==========
    function updateControls() {
      const lock = isSpinning;
      spinButton.disabled = lock;
      maxBtn.disabled = lock;
      betButtons.forEach(b => b.disabled = lock);
      resetButton.disabled = lock;
      resetStatsBtn.disabled = lock;
      shareBtn.disabled = lock;

      if (autoRunning) {
        autoBtn.disabled = false;
        autoBtn.textContent = '⏹ СТОП';
        autoBtn.classList.add('auto-running');
      } else {
        autoBtn.disabled = lock;
        autoBtn.textContent = '⚡ АВТО ×5';
        autoBtn.classList.remove('auto-running');
      }
    }

    // ========== Статистика ==========
    function renderStats() {
      document.getElementById('statSpins').textContent = stats.spins;
      document.getElementById('statWon').textContent = stats.totalWon.toLocaleString('ru-RU') + ' 🪙';
      document.getElementById('statBest').textContent = stats.bestWin.toLocaleString('ru-RU') + ' 🪙';
      document.getElementById('statJackpots').textContent = stats.jackpots;
      const net = stats.totalWon - stats.totalBet;
      const el = document.getElementById('statNet');
      el.textContent = (net >= 0 ? '+' : '') + net.toLocaleString('ru-RU') + ' 🪙';
      el.className = 'stat-value ' + (net >= 0 ? 'pos' : 'neg');
    }
    resetStatsBtn.addEventListener('click', () => {
      if (!confirm('Сбросить всю статистику?')) return;
      stats = { spins: 0, totalBet: 0, totalWon: 0, bestWin: 0, jackpots: 0, diamonds: 0, lucky7: 0 };
      saveStats();
      renderStats(); renderLevel(); checkAchievements();
      messageEl.textContent = 'Статистика сброшена';
    });

    // ========== История ==========
    function renderHistory() {
      const el = document.getElementById('historyList');
      el.innerHTML = '';
      history.slice(0, 5).forEach(item => {
        const d = document.createElement('div');
        d.className = 'history-item' + (item.jackpot ? ' jackpot' : '');
        d.textContent = item.symbols.join('');
        el.appendChild(d);
      });
    }
    function addHistory(symbols, jackpot) {
      history.unshift({ symbols, jackpot });
      history = history.slice(0, 5);
      localStorage.setItem('casino_history', JSON.stringify(history));
      renderHistory();
    }

    // ========== Бонус ==========
    const BONUS_KEY = 'casino_last_bonus';
    const BONUS_AMOUNT = 500;
    const BONUS_COOLDOWN = 24 * 60 * 60 * 1000;
    function updateBonusBtn() {
      const last = loadNum(BONUS_KEY, 0);
      const left = BONUS_COOLDOWN - (Date.now() - last);
      if (left <= 0) {
        bonusBtn.disabled = false;
        bonusBtn.textContent = '🎁 Забрать бонус +' + BONUS_AMOUNT;
      } else {
        bonusBtn.disabled = true;
        const h = Math.floor(left / 3600000), m = Math.floor((left % 3600000) / 60000);
        bonusBtn.textContent = '🎁 Бонус через ' + h + ' ч ' + m + ' мин';
      }
    }
    bonusBtn.addEventListener('click', () => {
      if (bonusBtn.disabled) return;
      unlockAudio();
      balance += BONUS_AMOUNT;
      saveBalance(); updateBalanceUI();
      localStorage.setItem(BONUS_KEY, String(Date.now()));
      updateBonusBtn();
      messageEl.textContent = '🎁 Бонус получен! +' + BONUS_AMOUNT + ' 🪙';
      soundWin();
      showBanner('🎁 +' + BONUS_AMOUNT, false);
      checkAchievements();
    });

    // ========== Баннер и тост ==========
    function showBanner(text, big) {
      const el = document.getElementById('winBanner');
      el.textContent = text;
      el.classList.toggle('small', !big);
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    }
    function showToast(text) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ========== Реальные барабаны ==========
    const symbols = ["🍒", "🍋", "🍊", "🍉", "⭐", "💎", "7️⃣"];
    const SYM_H = 80;
    const CYCLE = symbols.length * SYM_H; // 560
    const REEL_COPIES = 6;

    // Текущее вертикальное смещение лент (в пикселях, отрицательные — вниз)
    const reelOffsets = [0, -SYM_H, -4 * SYM_H]; // 🍒, 🍋, ⭐

    function buildReel(el) {
      el.innerHTML = '';
      for (let c = 0; c < REEL_COPIES; c++) {
        symbols.forEach(s => {
          const d = document.createElement('div');
          d.className = 'sym';
          d.textContent = s;
          el.appendChild(d);
        });
      }
    }

    function initReels() {
      reelEls.forEach((el, i) => {
        buildReel(el);
        el.style.transform = 'translateY(' + reelOffsets[i] + 'px)';
      });
    }

    function vibrate(type = 'medium') {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(type);
      else if (navigator.vibrate) navigator.vibrate(30);
    }
    function clearWinGlow() { slotEls.forEach(s => s.classList.remove('win')); }

    // Настоящее кручение: лента едет вниз, замедляется, доводится до нужного символа
    function animateReels() {
      return new Promise(resolve => {
        const results = [0, 1, 2].map(() => Math.floor(Math.random() * symbols.length));
        const now = performance.now();

        const spinSpeed = 1000;                  // пикселей в секунду при разгоне
        const stopTimes = [now + 1200, now + 1600, now + 2000]; // когда начинать тормозить
        const decelTime = 750;                   // длительность торможения, мс

        // Вычислить финальные позиции
        const targets = [0, 0, 0];
        for (let i = 0; i < 3; i++) {
          const spinDur = (stopTimes[i] - now) / 1000;
          const offsetAtStop = reelOffsets[i] - spinSpeed * spinDur;
          // Позиция mod CYCLE, где верхний символ = results[i]
          const targetMod = ((-results[i] * SYM_H) % CYCLE + CYCLE) % CYCLE;
          const currentMod = ((offsetAtStop % CYCLE) + CYCLE) % CYCLE;
          let delta = (currentMod - targetMod + CYCLE) % CYCLE;
          delta += CYCLE; // ещё один полный оборот для красоты
          targets[i] = offsetAtStop - delta;
        }

        const stopping = [false, false, false];
        const done = [false, false, false];
        const stopStart = [0, 0, 0];
        const stopStartOffset = [0, 0, 0];
        const lastSymIdx = [0, 0, 0];

        let lastTickTime = now;
        let lastFrameTime = now;

        function frame(t) {
          const dt = Math.min(0.05, (t - lastFrameTime) / 1000);
          lastFrameTime = t;

          for (let i = 0; i < 3; i++) {
            if (done[i]) continue;

            if (!stopping[i]) {
              if (t < stopTimes[i]) {
                // Быстрое вращение
                reelOffsets[i] -= spinSpeed * dt;
                if (reelOffsets[i] < -CYCLE * 4) reelOffsets[i] += CYCLE;
                // Звук стука на каждой новой позиции
                const symIdx = Math.floor(-reelOffsets[i] / SYM_H) % symbols.length;
                if (symIdx !== lastSymIdx[i]) {
                  if (t - lastTickTime > 60) {
                    soundReelTick();
                    lastTickTime = t;
                  }
                  lastSymIdx[i] = symIdx;
                }
              } else {
                stopping[i] = true;
                stopStart[i] = t;
                stopStartOffset[i] = reelOffsets[i];
              }
            } else {
              // Торможение с ease-out (кубическая кривая)
              const progress = Math.min(1, (t - stopStart[i]) / decelTime);
              const eased = 1 - Math.pow(1 - progress, 3);
              reelOffsets[i] = stopStartOffset[i] + (targets[i] - stopStartOffset[i]) * eased;
              // Звук стука на каждой новой позиции (замедляется вместе с барабаном)
              const symIdx = Math.floor(-reelOffsets[i] / SYM_H) % symbols.length;
              if (symIdx !== lastSymIdx[i]) {
                soundReelTick();
                lastSymIdx[i] = symIdx;
              }
              if (progress >= 1) {
                done[i] = true;
                soundReelStop();
                vibrate('light');
              }
            }

            reelEls[i].style.transform = 'translateY(' + reelOffsets[i] + 'px)';
          }

          if (done.every(d => d)) { resolve(results.map(i => symbols[i])); return; }
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      });
    }

    async function spinOnce() {
      if (balance < bet) {
        messageEl.textContent = 'Недостаточно монет для ставки ' + bet;
        return;
      }
      unlockAudio();
      clearWinGlow();
      balance -= bet;
      saveBalance(); updateBalanceUI();
      messageEl.textContent = 'Крутим...';
      vibrate();

      const result = await animateReels();
      const { cur } = getLevel();
      const levelBonus = cur.bonus;

      let win = 0, isJackpot = false;
      const [a, b, c] = result;

      if (a === b && b === c) {
        isJackpot = true;
        let mult = 10;
        if (a === '💎') { mult = 30; stats.diamonds++; }
        if (a === '7️⃣') { mult = 50; stats.lucky7++; }
        win = Math.round(bet * mult * (1 + levelBonus / 100));
        stats.jackpots++;
        messageEl.textContent = '🎉 ДЖЕКПОТ! +' + win + ' 🪙';
        slotEls.forEach(s => s.classList.add('win'));
        soundJackpot();
        showBanner('🎉 +' + win, true);
        progressDaily('jackpot', 1);
      } else if (a === b || b === c || a === c) {
        win = Math.round(bet * 2 * (1 + levelBonus / 100));
        messageEl.textContent = '👍 Совпадение! +' + win + ' 🪙';
        slotEls.forEach(s => s.classList.add('win'));
        soundWin();
        showBanner('+' + win, false);
      } else {
        messageEl.textContent = 'Попробуйте ещё раз';
        soundLose();
      }

      if (win > 0) { balance += win; saveBalance(); updateBalanceUI(); }

      stats.spins++;
      stats.totalBet += bet;
      stats.totalWon += win;
      if (win > stats.bestWin) stats.bestWin = win;
      saveStats();
      renderStats(); renderLevel();
      progressDaily('spins20', 1);
      progressDaily('bet1000', bet);
      addHistory(result, isJackpot);
      checkAchievements();
    }

    async function spin() {
      if (isSpinning) return;
      isSpinning = true; updateControls();
      await spinOnce();
      isSpinning = false; updateControls();
    }

    async function startAuto() {
      if (autoRunning) { autoRunning = false; return; }
      if (isSpinning) return;
      autoRunning = true; isSpinning = true; updateControls();
      for (let i = 0; i < 5; i++) {
        if (!autoRunning) break;
        if (balance < bet) { messageEl.textContent = 'Недостаточно монет'; break; }
        await spinOnce();
        await new Promise(r => setTimeout(r, 250));
      }
      autoRunning = false; isSpinning = false; updateControls();
    }

    spinButton.addEventListener('click', spin);
    autoBtn.addEventListener('click', () => { if (autoRunning) autoRunning = false; else startAuto(); });

    resetButton.addEventListener('click', () => {
      if (!confirm('Сбросить баланс?')) return;
      balance = START_BALANCE;
      saveBalance(); updateBalanceUI();
      messageEl.textContent = 'Баланс сброшен';
      checkAchievements();
    });

    // ========== Поделиться ==========
    const SHARE_URL = 'https://t.me/kyrgyz_casino_bot/minicasino';
    shareBtn.addEventListener('click', () => {
      const text = 'Я играю в 🎰 Мини-казино! Попробуй и ты — там джекпоты и уровни.';
      const url = 'https://t.me/share/url?url=' + encodeURIComponent(SHARE_URL) + '&text=' + encodeURIComponent(text);
      if (tg?.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, '_blank');
    });

    // ========== Инициализация ==========
    initReels();
    updateBalanceUI();
    renderHistory();
    renderStats();
    renderLevel();
    renderAchievements();
    renderDaily();
    updateBonusBtn();
    updateBetUI();
    updateControls();
    checkAchievements();
    setInterval(updateBonusBtn, 60000);
  </script>
</body>
